  <rect x="0" y="0" width="2000" height="180" fill="url(#nightSky)"/>

  <!-- Moon Atmosphere & Crescent Moon -->
  <circle cx="520" cy="42" r="42" fill="url(#moonGlow)"/>
  <path d="M528,26 C515,28 505,39 505,53 C505,67 516,78 530,79 C518,78 509,68 509,56 C509,42 517,30 528,26 Z" fill="#e0f2fe" filter="url(#neonBlur)"/>

  <circle cx="1520" cy="42" r="42" fill="url(#moonGlow)"/>
