<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Route Progression Panel (Night Mode) - 1200x400</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: #060913;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .panel-card {
      width: 1200px;
      height: 400px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: #0b1020;
      border: 1.5px solid #24304f;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px -5px rgba(37, 99, 235, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    @keyframes busBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes roadDash {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -120; }
    }
    @keyframes neonGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.6), 0 0 45px rgba(37, 99, 235, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.4);
        text-shadow: 0 0 10px #38bdf8, 0 0 25px #0284c7, 0 0 40px #2563eb;
      }
      50% {
        box-shadow: 0 0 30px rgba(56, 189, 248, 0.85), 0 0 65px rgba(37, 99, 235, 0.6), inset 0 0 22px rgba(56, 189, 248, 0.6);
        text-shadow: 0 0 14px #7dd3fc, 0 0 32px #38bdf8, 0 0 55px #0284c7;
      }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes headlightSweep {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.95; }
    }
    .bus-vehicle {
      animation: busBob 2.2s ease-in-out infinite;
    }
    .road-lines {
      stroke-dasharray: 28 20;
      animation: roadDash 1.2s linear infinite;
    }
    .neon-pulsing {
      animation: neonGlow 2.5s ease-in-out infinite;
    }
    .star-twinkle-1 { animation: starTwinkle 3s ease-in-out infinite; }
    .star-twinkle-2 { animation: starTwinkle 2.2s ease-in-out infinite 0.7s; }
    .star-twinkle-3 { animation: starTwinkle 3.7s ease-in-out infinite 1.4s; }
  </style>
</head>
<body>

  <!-- 1200x400 Container Panel -->
  <div class="panel-card select-none">
    
    <!-- TOP HEADER BAR -->
    <header class="relative z-20 px-8 pt-5 pb-3 flex items-start justify-between bg-[#0b1020]/90 backdrop-blur-sm border-b border-[#1f2942]">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee] animate-pulse"></span>
          <span class="text-[12px] font-extrabold uppercase tracking-widest text-slate-400">
            Route Progression <span class="text-slate-500 font-medium">· TN-01 Night Fleet Telemetry</span>
          </span>
        </div>
        <div class="flex items-baseline gap-3">
          <h1 class="text-[26px] font-black tracking-tight text-white leading-none">
            NEXT STOP: <span class="text-cyan-400 drop-shadow-[0_0_12px_rgba(34,211,238,0.5)]">PALLADAM</span>
          </h1>
          <span class="inline-flex items-center px-3 py-1 rounded-full text-[13px] font-black bg-cyan-950/80 text-cyan-300 border border-cyan-700/60 shadow-[0_0_10px_rgba(34,211,238,0.2)]">
            ETA 48S
          </span>
        </div>
      </div>

      <!-- Mode & Tag -->
      <div class="flex items-center gap-3">
        <!-- Night indicator badge -->
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-950/70 border border-indigo-700/50 text-indigo-300 text-[11px] font-bold">
          <svg class="w-3.5 h-3.5 text-indigo-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
          </svg>
          <span>NIGHT RUN · MOONLIT</span>
        </div>
        <!-- Pill tag simulated -->
        <div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-500 text-slate-950 shadow-[0_0_15px_rgba(245,158,11,0.5)]">
          <span class="w-2 h-2 rounded-full bg-slate-950 animate-ping"></span>
          <span class="text-[12px] font-black tracking-wider uppercase">SIMULATED</span>
        </div>
      </div>
    </header>

    <!-- CENTER HERO CANVAS: 2D SIDE-SCROLLING NIGHT STREET -->
    <div class="relative w-full h-[225px] overflow-hidden bg-gradient-to-b from-[#050816] via-[#091026] to-[#0f172a]">
      
      <!-- LAYER 1: DEEP NAVY SKY, STARS & GLOWING CRESCENT MOON -->
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 1200 225">
        <!-- Ambient Sky Nebula Gradient -->
        <defs>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Moon Atmospheric Aura -->
        <circle cx="960" cy="46" r="48" fill="url(#moonGlow)"/>
        
        <!-- Glowing Crescent Moon -->
        <path d="M968,28 C955,30 945,41 945,55 C945,69 956,80 970,81 C958,80 949,70 949,58 C949,44 957,32 968,28 Z" 
              fill="#e0f2fe" filter="drop-shadow(0 0 8px #bae6fd)"/>

        <!-- Twinkling Star Field -->
        <g fill="#ffffff">
          <!-- Group 1 -->
          <circle cx="120" cy="30" r="1.5" class="star-twinkle-1"/>
          <circle cx="210" cy="48" r="1.2" class="star-twinkle-2"/>
          <circle cx="340" cy="24" r="1.8" class="star-twinkle-3"/>
          <circle cx="480" cy="42" r="1" class="star-twinkle-1"/>
          <circle cx="610" cy="22" r="1.6" class="star-twinkle-2"/>
          <circle cx="730" cy="50" r="1.2" class="star-twinkle-3"/>
          <circle cx="850" cy="26" r="1.5" class="star-twinkle-1"/>
          <circle cx="1060" cy="38" r="1.3" class="star-twinkle-2"/>
          <circle cx="1140" cy="20" r="1.8" class="star-twinkle-3"/>

          <!-- Group 2 Secondary dim stars -->
          <circle cx="70" cy="60" r="0.8" opacity="0.4"/>
          <circle cx="280" cy="58" r="0.9" opacity="0.5"/>
          <circle cx="430" cy="65" r="0.8" opacity="0.4"/>
          <circle cx="560" cy="62" r="1" opacity="0.5"/>
          <circle cx="790" cy="40" r="0.9" opacity="0.4"/>
          <circle cx="890" cy="68" r="0.8" opacity="0.5"/>
          <circle cx="1110" cy="64" r="1" opacity="0.6"/>
        </g>
      </svg>

      <!-- LAYER 2: DARK SILHOUETTE BUILDINGS WITH GLOWING YELLOW WINDOWS -->
      <svg class="absolute inset-x-0 bottom-[54px] w-full h-[155px] pointer-events-none" viewBox="0 0 1200 155" preserveAspectRatio="none">
        <!-- Far building silhouettes (Deep Charcoal Navy) -->
        <path d="M0,155 L0,80 L50,80 L50,55 L105,55 L105,95 L160,95 L160,40 L210,40 L210,100 L270,100 L270,68 L330,68 L330,110 L400,110 L400,48 L460,48 L460,90 L530,90 L530,35 L590,35 L590,95 L660,95 L660,60 L720,60 L720,105 L790,105 L790,42 L850,42 L850,92 L920,92 L920,55 L980,55 L980,95 L1050,95 L1050,48 L1120,48 L1120,85 L1200,85 L1200,155 Z" 
              fill="#0d1424" opacity="0.9"/>

        <!-- Near building silhouettes (Solid Dark Indigo Black) -->
        <path d="M30,155 L30,90 L85,90 L85,62 L140,62 L140,155 M175,155 L175,76 L240,76 L240,155 M280,155 L280,50 L355,50 L355,155 M420,155 L420,72 L475,72 L475,155 M540,155 L540,82 L610,82 L610,155 M670,155 L670,55 L735,55 L735,155 M800,155 L800,70 L870,70 L870,155 M930,155 L930,60 L990,60 L990,155 M1060,155 L1060,78 L1140,78 L1140,155" 
              fill="#111a30"/>

        <!-- WARM GLOWING YELLOW & AMBER INTERIOR WINDOWS -->
        <g fill="#fef08a" filter="drop-shadow(0 0 5px rgba(253,224,71,0.7))">
          <!-- Building 1 -->
          <rect x="48" y="98" width="9" height="12" rx="1"/>
          <rect x="65" y="98" width="9" height="12" rx="1"/>
          <rect x="48" y="118" width="9" height="12" rx="1" fill="#fde047"/>
          
          <!-- Building 2 (Tower) -->
          <rect x="300" y="66" width="10" height="14" rx="1"/>
          <rect x="325" y="66" width="10" height="14" rx="1"/>
          <rect x="300" y="88" width="10" height="14" rx="1"/>
          <rect x="325" y="110" width="10" height="14" rx="1" fill="#fbbf24"/>

          <!-- Building 3 -->
          <rect x="435" y="86" width="10" height="12" rx="1"/>
          <rect x="455" y="104" width="10" height="12" rx="1"/>

          <!-- Building 4 -->
          <rect x="560" y="96" width="9" height="12" rx="1"/>
          <rect x="580" y="114" width="9" height="12" rx="1"/>

          <!-- Building 5 -->
          <rect x="688" y="72" width="10" height="14" rx="1"/>
          <rect x="710" y="92" width="10" height="14" rx="1"/>
          <rect x="688" y="112" width="10" height="14" rx="1"/>

          <!-- Building 6 -->
          <rect x="820" y="84" width="10" height="12" rx="1"/>
          <rect x="842" y="84" width="10" height="12" rx="1"/>
          <rect x="820" y="104" width="10" height="12" rx="1" fill="#fbbf24"/>

          <!-- Building 7 -->
          <rect x="948" y="78" width="9" height="12" rx="1"/>
          <rect x="968" y="96" width="9" height="12" rx="1"/>

          <!-- Building 8 -->
          <rect x="1080" y="92" width="10" height="12" rx="1"/>
          <rect x="1105" y="112" width="10" height="12" rx="1"/>
        </g>
      </svg>

      <!-- LAYER 3: STREETLIGHTS CASTING SOFT WARM POOLS OF LIGHT ON ROAD -->
      <svg class="absolute inset-x-0 bottom-0 w-full h-[120px] pointer-events-none" viewBox="0 0 1200 120">
        <defs>
          <!-- Streetlight warm pool gradient -->
          <linearGradient id="warmLightBeam" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45"/>
            <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="roadLightPuddle" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
            <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Light Cones & Road pools from 3 Streetlights -->
        <!-- Light 1 at x=140 -->
        <polygon points="144,38 95,115 195,115" fill="url(#warmLightBeam)"/>
        <ellipse cx="145" cy="108" rx="55" ry="10" fill="url(#roadLightPuddle)"/>
        
        <!-- Light 2 at x=520 -->
        <polygon points="524,38 475,115 575,115" fill="url(#warmLightBeam)"/>
        <ellipse cx="525" cy="108" rx="55" ry="10" fill="url(#roadLightPuddle)"/>

        <!-- Light 3 at x=730 -->
        <polygon points="734,38 685,115 785,115" fill="url(#warmLightBeam)"/>
        <ellipse cx="735" cy="108" rx="55" ry="10" fill="url(#roadLightPuddle)"/>

        <!-- Streetlight Posts -->
        <g stroke="#334155" stroke-width="2.5" fill="none">
          <path d="M120,115 L120,38 Q120,28 132,28 L146,28"/>
          <path d="M500,115 L500,38 Q500,28 512,28 L526,28"/>
          <path d="M710,115 L710,38 Q710,28 722,28 L736,28"/>
        </g>
        <!-- Lamp heads with bright glowing bulb -->
        <g fill="#fef08a" filter="drop-shadow(0 0 6px #fde047)">
          <circle cx="144" cy="31" r="3.5"/>
          <circle cx="524" cy="31" r="3.5"/>
          <circle cx="734" cy="31" r="3.5"/>
        </g>
      </svg>

      <!-- LAYER 4: WET ASPHALT ROAD WITH SPECULAR REFLECTIONS -->
      <div class="absolute inset-x-0 bottom-0 h-[56px] bg-[#090d18] border-t border-[#1e293b]">
        <!-- Wet Curb with specular edge line -->
        <div class="h-[5px] w-full bg-slate-800 border-b border-slate-700/80 shadow-[0_1px_4px_rgba(56,189,248,0.2)]"></div>

        <!-- Wet Sheen Reflections on Road -->
        <div class="absolute inset-0 bg-gradient-to-b from-cyan-950/20 via-transparent to-blue-950/30 pointer-events-none"></div>

        <!-- Moving road dashed centerline (slightly cyan/white tinted for night) -->
        <svg class="w-full h-[24px] mt-2" viewBox="0 0 1200 24">
          <line x1="0" y1="12" x2="1200" y2="12" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" class="road-lines" opacity="0.85"/>
        </svg>

        <!-- Wet road reflection streak underneath Neon Sign (right side) -->
        <div class="absolute right-[80px] bottom-1 w-[260px] h-[18px] bg-cyan-500/25 blur-md rounded-full pointer-events-none"></div>
        <!-- Wet road reflection streak underneath Bus Headlight (front of bus) -->
        <div class="absolute left-[380px] bottom-1 w-[240px] h-[16px] bg-sky-200/20 blur-md rounded-full pointer-events-none"></div>
      </div>

      <!-- LAYER 5: THE STOP SIGN (STRONG REALISTIC NEON GLOW - NIGHT MODE) -->
      <!-- Positioned hovering over the road on the right (approx 78% from left) -->
      <div class="absolute right-[110px] bottom-[26px] z-20 flex flex-col items-center">
        <!-- Floating Neon Sign Board -->
        <div class="relative bg-[#050b18] px-6 py-2.5 rounded-xl border-2 border-cyan-400 neon-pulsing flex flex-col items-center min-w-[220px]">
          <!-- Subtitle neon label -->
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-300 shadow-[0_0_6px_#67e8f9]"></span>
            <span class="text-[9px] font-black uppercase tracking-widest text-cyan-300 drop-shadow-[0_0_4px_#38bdf8]">
              NEXT ARRIVAL WAYPOINT
            </span>
          </div>
          <!-- Massive Glowing Neon Word "PALLADAM" -->
          <span class="text-[29px] font-black tracking-widest text-white leading-tight">
            PALLADAM
          </span>
          <div class="text-[10px] font-extrabold text-cyan-400 tracking-wider mt-0.5 uppercase drop-shadow-[0_0_4px_#38bdf8]">
            ETA 48 SECONDS · BAY 2
          </div>

          <!-- Glass neon gas tube highlight -->
          <div class="absolute inset-x-2 top-1 h-[1px] bg-cyan-200 opacity-60"></div>
        </div>

        <!-- Cantilevered Industrial Truss Support Posts -->
        <svg class="w-[180px] h-[60px]" viewBox="0 0 180 60" fill="none">
          <path d="M30,0 L30,60 M150,0 L150,60" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
          <path d="M30,12 L150,38 M150,12 L30,38" stroke="#334155" stroke-width="2"/>
          <!-- Neon glow bouncing off metal posts -->
          <path d="M30,0 L30,25 M150,0 L150,25" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
        </svg>
      </div>

      <!-- LAYER 6: THE BUS (TN-01) WITH BRIGHT WHITE HEADLIGHTS & SPEED LINES -->
      <div class="absolute left-[190px] bottom-[14px] z-30 flex items-center bus-vehicle">
        
        <!-- Speed Lines Streaming Behind the Bus (Night glow cyan/blue) -->
        <svg class="w-[90px] h-[48px] -mr-3" viewBox="0 0 90 48" fill="none">
          <line x1="10" y1="12" x2="80" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9" filter="drop-shadow(0 0 4px #0284c7)"/>
          <line x1="30" y1="22" x2="88" y2="22" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="5" y1="32" x2="75" y2="32" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <line x1="40" y1="40" x2="85" y2="40" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </svg>

        <!-- Bus SVG Graphics (Night edition with illuminated interior and lights) -->
        <svg class="w-[195px] h-[82px]" viewBox="0 0 195 82" fill="none" class="relative z-10">
          <!-- Deep Ground Shadow -->
          <ellipse cx="98" cy="74" rx="84" ry="5.5" fill="#000000" opacity="0.75"/>

          <!-- Bus Body (Vibrant Blue TN-01 with nocturnal shadows) -->
          <g>
            <!-- Lower Main Body -->
            <rect x="12" y="24" width="168" height="42" rx="10" fill="#1d4ed8"/>
            <!-- Upper white roof -->
            <path d="M22,10 L168,10 Q178,10 178,22 L178,26 L12,26 L12,22 Q12,10 22,10 Z" fill="#e2e8f0"/>
            
            <!-- Side Decal stripe (Cyan neon retro-reflective tape) -->
            <path d="M12,48 L180,48 L178,54 L12,54 Z" fill="#38bdf8" opacity="0.95" filter="drop-shadow(0 0 3px #0284c7)"/>
            <path d="M12,52 L178,52 L177,54 L12,54 Z" fill="#f59e0b"/>

            <!-- Front Slanted Windshield & Passenger Windows -->
            <!-- Front Windshield -->
            <path d="M148,15 L174,15 Q177,15 176,26 L175,40 L148,40 Z" fill="#070c18"/>
            
            <!-- Windows Row (Soft warm interior passenger cabin light!) -->
            <rect x="22" y="16" width="22" height="24" rx="4" fill="#fef08a" opacity="0.85" filter="drop-shadow(0 0 3px rgba(254,240,138,0.5))"/>
            <rect x="49" y="16" width="26" height="24" rx="4" fill="#fef08a" opacity="0.85" filter="drop-shadow(0 0 3px rgba(254,240,138,0.5))"/>
            <rect x="80" y="16" width="26" height="24" rx="4" fill="#fef08a" opacity="0.85" filter="drop-shadow(0 0 3px rgba(254,240,138,0.5))"/>
            <rect x="111" y="16" width="26" height="24" rx="4" fill="#fef08a" opacity="0.85" filter="drop-shadow(0 0 3px rgba(254,240,138,0.5))"/>

            <!-- Passenger Silhouettes inside glowing windows -->
            <circle cx="33" cy="25" r="3.5" fill="#1e293b"/>
            <circle cx="62" cy="25" r="3.5" fill="#1e293b"/>
            <circle cx="93" cy="25" r="3.5" fill="#1e293b"/>
            <circle cx="124" cy="25" r="3.5" fill="#1e293b"/>

            <!-- Front High-Beam Headlight Housing (Super bright white-cyan) -->
            <rect x="174" y="46" width="6" height="8" rx="2" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 15px #38bdf8)"/>

            <!-- Rear Crimson Taillight with red night flare -->
            <rect x="12" y="46" width="4" height="8" rx="1.5" fill="#ef4444" filter="drop-shadow(0 0 6px #ef4444)"/>

            <!-- Vehicle Label Unit badge -->
            <rect x="74" y="58" width="48" height="8" rx="2" fill="#0f172a"/>
            <text x="98" y="64.5" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="800" text-anchor="middle" letter-spacing="0.5">TN-01 · EXPR</text>
            
            <!-- Wheel Cutouts -->
            <circle cx="48" cy="66" r="14" fill="#020617"/>
            <circle cx="142" cy="66" r="14" fill="#020617"/>

            <!-- Wheel 1 (Front) -->
            <circle cx="142" cy="66" r="11" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
            <circle cx="142" cy="66" r="5" fill="#475569"/>
            <circle cx="142" cy="66" r="2" fill="#94a3b8"/>

            <!-- Wheel 2 (Rear) -->
            <circle cx="48" cy="66" r="11" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
            <circle cx="48" cy="66" r="5" fill="#475569"/>
            <circle cx="48" cy="66" r="2" fill="#94a3b8"/>
          </g>
        </svg>

        <!-- BRIGHT VOLUMETRIC HEADLIGHT BEAM PROJECTING FORWARD ACROSS ROAD -->
        <svg class="w-[280px] h-[95px] -ml-2 pointer-events-none" viewBox="0 0 280 95" style="animation: headlightSweep 3s ease-in-out infinite;">
          <defs>
            <linearGradient id="headlightConeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.7"/>
              <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="brightCore" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
              <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <!-- Outer soft light spread cone -->
          <polygon points="0,50 280,18 280,82" fill="url(#headlightConeGrad)"/>
          <!-- Inner intense bright core beam -->
          <polygon points="0,50 180,32 180,68" fill="url(#brightCore)"/>
        </svg>

      </div>

    </div>

    <!-- BOTTOM TELEMETRY BAR (HIGH CONTRAST & LEGIBILITY AT 4 METERS) -->
    <footer class="relative z-20 px-8 py-3.5 bg-[#0b1020] border-t border-[#1f2942] flex items-center justify-between">
      
      <!-- Bottom-Left: Speed -->
      <div class="flex items-center gap-3">
        <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
        <div class="flex items-baseline gap-2">
          <span class="text-[12px] font-extrabold uppercase tracking-wider text-slate-400">CURRENT SPEED:</span>
          <span class="text-[20px] font-black text-white tabular-nums">48 <span class="text-[14px] font-bold text-slate-400">km/h</span></span>
        </div>
        <span class="px-2.5 py-0.5 rounded text-[11px] font-extrabold bg-emerald-950/80 border border-emerald-600/50 text-emerald-300">
          CRUISING OPTIMAL
        </span>
      </div>

      <!-- Center: Corridor Waypoint Sequence -->
      <div class="flex items-center gap-2 text-[12px] font-extrabold tracking-wider text-slate-500">
